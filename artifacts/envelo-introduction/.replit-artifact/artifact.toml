kind = "video"
videoAspectRatio = "16:9"
previewPath = "/envelo-introduction/"
title = "Envelo Introduction Video"
description = "A 60-second cinematic explainer for Envelo (privacy-first invoicing on Arc Testnet): what it is and how it works, seal, anchor, pay, grant and verify, with stylized recreations of the product screens, on-screen text and music, no voiceover. 16:9 for the launch tweet."
version = "1.0.0"
id = "artifacts/envelo-introduction"
router = "path"

[[services]]
name = "web"
paths = [ "/envelo-introduction/" ]
localPort = 20650

[services.development]
run = "pnpm --filter @workspace/envelo-introduction run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/envelo-introduction", "run", "build" ]
serve = "static"
publicDir = "artifacts/envelo-introduction/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20650"
BASE_PATH = "/envelo-introduction/"
