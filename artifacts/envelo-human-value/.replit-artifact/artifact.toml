kind = "video"
previewPath = "/envelo-human-value/"
title = "Envelo Launch Variation 3: Human Value"
description = "A human-centered 16:9 Envelo launch video for X, combining restrained animation and real product UI to show why private invoicing protects client relationships, pricing, terms, and business trust."
version = "1.0.0"
id = "artifacts/envelo-human-value"
router = "path"

[[services]]
name = "web"
paths = [ "/envelo-human-value/" ]
localPort = 22613

[services.development]
run = "pnpm --filter @workspace/envelo-human-value run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/envelo-human-value", "run", "build" ]
serve = "static"
publicDir = "artifacts/envelo-human-value/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22613"
BASE_PATH = "/envelo-human-value/"
