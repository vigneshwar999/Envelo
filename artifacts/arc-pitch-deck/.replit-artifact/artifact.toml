kind = "slides"
previewPath = "/arc-pitch-deck/"
title = "Envelo Pitch Deck"
description = "A 12-slide pitch deck for the Arc builder program and Builders Fund submission of Envelo: the problem of leaky, unverifiable invoices; the sealed-envelope solution anchored on Arc; USDC-native payments; what is live today on Arc Testnet; the three-phase Arc mainnet plan; verifiable milestones and the ask; the team and honest limits."
version = "1.0.0"
id = "artifacts/arc-pitch-deck"
router = "path"

[[services]]
name = "web"
paths = [ "/arc-pitch-deck/" ]
localPort = 22322

[services.development]
run = "pnpm --filter @workspace/arc-pitch-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arc-pitch-deck", "run", "build" ]
serve = "static"
publicDir = "artifacts/arc-pitch-deck/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22322"
BASE_PATH = "/arc-pitch-deck/"
