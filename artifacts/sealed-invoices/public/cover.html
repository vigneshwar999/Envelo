<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Envelo X Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 3000px; height: 1000px; overflow: hidden; }
  body {
    position: relative;
    background: #050505;
    font-family: 'Inter', sans-serif;
    color: #fafafa;
  }

  /* vertical hairline grid, fading toward the bottom */
  .grid {
    position: absolute;
    left: 50%; top: 0;
    transform: translateX(-50%);
    width: 2320px; height: 100%;
    background-image: repeating-linear-gradient(
      90deg,
      rgba(255, 255, 255, 0.05) 0,
      rgba(255, 255, 255, 0.05) 1px,
      transparent 1px,
      transparent 232px
    );
    -webkit-mask-image: linear-gradient(to bottom, black 0%, black 55%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 0%, black 55%, transparent 100%);
  }

  /* dotted matrix patches */
  .dots {
    position: absolute;
    background-image: radial-gradient(circle, rgba(255, 255, 255, 0.32) 1px, transparent 1.1px);
    background-size: 7px 7px;
  }
  .dots-right {
    top: -8%; right: -4%;
    width: 1250px; height: 760px;
    opacity: 0.17;
    -webkit-mask-image: radial-gradient(ellipse 62% 55% at 60% 40%, black 0%, transparent 70%);
    mask-image: radial-gradient(ellipse 62% 55% at 60% 40%, black 0%, transparent 70%);
  }
  .dots-left {
    bottom: -12%; left: -5%;
    width: 1100px; height: 680px;
    opacity: 0.11;
    -webkit-mask-image: radial-gradient(ellipse 60% 50% at 40% 55%, black 0%, transparent 70%);
    mask-image: radial-gradient(ellipse 60% 50% at 40% 55%, black 0%, transparent 70%);
  }

  /* soft silver glow behind the headline */
  .glow {
    position: absolute;
    left: 50%; top: 42%;
    transform: translate(-50%, -50%);
    width: 2000px; height: 900px;
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(201, 206, 212, 0.085) 0%, transparent 70%);
  }

  /* giant ghosted logo, right side */
  .ghost {
    position: absolute;
    right: 110px; top: 50%;
    transform: translateY(-50%) rotate(-8deg);
    width: 660px; height: 660px;
    opacity: 0.055;
    filter: drop-shadow(0 0 80px rgba(201, 206, 212, 0.5));
  }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-bottom: 30px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 26px;
    margin-bottom: 66px;
  }
  .brand img { width: 92px; height: 92px; }
  .brand .name {
    font-size: 78px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    margin-left: 18px;
    padding: 14px 30px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.045);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.62);
  }
  .badge .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #c9ced4;
    box-shadow: 0 0 18px rgba(201, 206, 212, 0.9);
  }

  h1 {
    font-size: 168px;
    line-height: 1.04;
    font-weight: 300;
    letter-spacing: -0.035em;
  }
  h1 .private { color: #f4f5f6; }
  h1 .public { color: #83888e; }

  .sub {
    margin-top: 58px;
    font-size: 42px;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: rgba(255, 255, 255, 0.5);
  }
  .sub .sep { margin: 0 26px; color: rgba(255, 255, 255, 0.25); }
  .sub .url { color: rgba(255, 255, 255, 0.78); font-weight: 500; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="dots dots-right"></div>
  <div class="dots dots-left"></div>
  <div class="glow"></div>
  <img class="ghost" src="logo.svg" alt="" />

  <div class="content">
    <div class="brand">
      <img src="logo.svg" alt="Envelo logo" />
      <span class="name">Envelo</span>
      <span class="badge"><span class="dot"></span>Arc Testnet</span>
    </div>
    <h1>
      <span class="private">Private paperwork.</span><br />
      <span class="public">Public proof.</span>
    </h1>
    <div class="sub">
      Sealed invoicing on Circle&rsquo;s Arc Testnet<span class="sep">&middot;</span><span class="url">envelo.online</span>
    </div>
  </div>
</body>
</html>
