kind = "video"
videoAspectRatio = "16:9"
previewPath = "/launch-video/"
title = "Envelo Launch Video"
description = "A 29.5-second first-tweet introduction to Envelo: privacy-first invoicing, encrypted invoice details versus public blockchain payments, the Seal/Anchor/Settle/Verify flow, and the Envelo end card. Uses existing product materials with restrained motion and instrumental music."
version = "1.0.0"
id = "artifacts/launch-video"
router = "path"

[[services]]
name = "web"
paths = [ "/launch-video/" ]
localPort = 19679

[services.development]
run = "pnpm --filter @workspace/launch-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/launch-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/launch-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19679"
BASE_PATH = "/launch-video/"
