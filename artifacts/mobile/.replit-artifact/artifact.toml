kind = "mobile"
previewPath = "/mobile/"
title = "Sealed Invoices Mobile"
description = "A native mobile companion for Sealed Invoices clients. Sign in with the same account as the web app, see invoices shared with you, restore your envelope key from a passphrase-locked backup, open sealed invoices on your phone, check paid status against Arc Testnet, verify document fingerprints, and pay outstanding invoices in test USDC."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
